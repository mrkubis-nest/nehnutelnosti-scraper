name: Scrape nehnutelnosti.sk

on:
  schedule:
    # Časy sú v UTC. Leto na Slovensku = UTC+2, zima = UTC+1.
    # 05:00, 11:00 a 17:00 UTC ≈ 7:00, 13:00 a 19:00 nášho času (v lete).
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:        # umožní spustiť ručne tlačidlom v záložke Actions

# Zabráni súbežnému behu, keby predchádzajúci ešte dobiehal.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write           # commit databázy späť do repozitára
  pages: write              # publikovanie stránky
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Inštalácia závislostí
        run: pip install -r requirements.txt

      - name: Scrapovanie
        env:
          EXCEL_ENABLED: "true"
          WEB_ENABLED: "true"
          HTML_ENABLED: "false"
          CSV_ENABLED: "false"
          SHEETS_ENABLED: "false"
          EMAIL_ENABLED: "false"
          DB_PATH: data/seen.sqlite3
          EXCEL_PATH: public/ponuky.xlsx
          WEB_PATH: public/index.html
          REQUEST_DELAY: "1.0"
        run: python run.py

      - name: Uloženie databázy do repozitára
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data public
          if git diff --staged --quiet; then
            echo "Žiadne zmeny."
          else
            git commit -m "Aktualizácia ponúk – $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # Výsledok na stiahnutie priamo z behu – funguje aj na súkromnom
      # repozitári, kde GitHub Pages nie je k dispozícii.
      - uses: actions/upload-artifact@v4
        with:
          name: ponuky
          path: |
            public/ponuky.xlsx
            public/index.html
          retention-days: 30

      - name: Príprava pre GitHub Pages
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Publikovanie stránky. GitHub Pages nie je na bezplatnom účte pri súkromnom
  # repozitári dostupné, preto je tento krok vypnutý. Zapneš ho tak, že
  # repozitár prepneš na verejný a nastavíš premennú ENABLE_PAGES na "true":
  #   gh variable set ENABLE_PAGES --body true
  deploy:
    needs: scrape
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
